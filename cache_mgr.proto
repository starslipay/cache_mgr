syntax = "proto3";

package cache_mgr;
// 相对路径;包名
option go_package = "./cache_mgr_pb";

// 更新余额Req(由消费端 t_update_balance 回调)
message UpdateBalanceReq {
    int64 uid = 1;
    int64 cur_type = 2;
    int64 balance = 3;
    int64 balance_modify_time_s = 4;   // 余额变更时间(秒)
    int64 balance_modify_time_ms = 5;  // 余额变更时间的毫秒部分(0-999)
}

// 更新余额Rsp
message UpdateBalanceRsp {
}

// 更新relation Req(由消费端 t_update_relation 回调)
message UpdateRelationReq {
    string user_id = 1;
    int64 uid = 2;
}

// 更新relation Rsp
message UpdateRelationRsp {
}

// 删除relation缓存 Req(注销用户后由消费端回调)
message DeleteRelationReq {
    string user_id = 1;
}

// 删除relation缓存 Rsp
message DeleteRelationRsp {
}

service CacheMgr {
    rpc UpdateBalance(UpdateBalanceReq) returns (UpdateBalanceRsp);  // 更新余额缓存到ckv(由消费端回调)
    rpc UpdateRelation(UpdateRelationReq) returns (UpdateRelationRsp);  // 更新relation缓存到redis(由消费端回调)
    rpc DeleteRelation(DeleteRelationReq) returns (DeleteRelationRsp);  // 删除relation缓存(注销用户后由消费端回调)
}

/*
生成项目框架
goctl rpc protoc cache_mgr.proto --go_out=. --go-grpc_out=. --zrpc_out=.
*/
